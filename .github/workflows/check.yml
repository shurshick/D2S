name: D2S checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Shell and JavaScript syntax
        run: |
          while IFS= read -r file; do
            if head -n 1 "$file" | grep -q bash; then bash -n "$file"; else sh -n "$file"; fi
          done < <(find files scripts -type f -name '*.sh')
          sh -n install.sh
          sh -n files/S99d2s
          sh -n files/S96d2s-resolver
          sh -n files/S97d2s-dns-watch
          node --check internal/web/assets/panel.js
      - run: python3 tests/keenetic/test-upstream-network.py
      - run: python3 scripts/test-namespace.py
      - run: python3 scripts/test-ci-engine-key.py
      - run: python3 scripts/test-release-gate.py
      - run: sh scripts/test-s99-firewall-stub.sh
      - run: sh scripts/test-tg-firewall-nft.sh
      - run: node scripts/test-install-release.cjs
      - run: node scripts/test-install-openwrt.cjs
      - run: node scripts/test-update.cjs
      - run: sh scripts/check-d2s-extras.sh
      - run: make -C telegram test
      - run: make -C panel test test-js
      - run: |
          cc -O1 -g -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/d2s-dns-test resolver-local/test-dns-media-watch.c
          /tmp/d2s-dns-test

  engine:
    name: Engine regression proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          python3 -m pip install --target "$RUNNER_TEMP/zig" ziglang==0.16.0
          echo "ZIG=$RUNNER_TEMP/zig/ziglang/zig" >> "$GITHUB_ENV"
      - id: key
        name: Fingerprint engine sources and test platform
        run: |
          key=$( { sh scripts/ci-engine-key.sh; cc -dumpfullversion; "$ZIG" version; qemu-mips --version | head -n 1; } | sha256sum | cut -d' ' -f1)
          echo "value=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: proof
        with:
          path: build/ci/engine-passed
          key: d2s-engine-v1-${{ runner.os }}-${{ steps.key.outputs.value }}
      - id: reuse
        env:
          EXPECTED: ${{ steps.key.outputs.value }}
          CACHE_HIT: ${{ steps.proof.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ] && [ "$(cat build/ci/engine-passed 2>/dev/null)" = "$EXPECTED" ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo 'Unchanged engine sources: reuse the successful full regression proof.'
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Full engine regression suite
        if: steps.reuse.outputs.passed != 'true'
        env:
          EXPECTED: ${{ steps.key.outputs.value }}
        run: |
          make -C core check ZIG="$ZIG"
          make -C datapath check ZIG="$ZIG"
          make -C detect check
          mkdir -p build/ci
          printf '%s\n' "$EXPECTED" > build/ci/engine-passed
