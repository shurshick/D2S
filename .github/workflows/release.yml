name: D2S release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.1.1 (without prefix)'
        required: true
        type: string
      clean_build:
        description: 'Rebuild crypto libraries without a cache'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: Checked release source
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/require-ci.py
      - id: source
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  build:
    name: Build runtime (${{ matrix.arch }})
    timeout-minutes: 30
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, mipsel]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - name: Install pinned compiler and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev zlib1g-dev qemu-user
          python3 -m pip install --target "$RUNNER_TEMP/zig" ziglang==0.16.0
          echo "ZIG=$RUNNER_TEMP/zig/ziglang/zig" >> "$GITHUB_ENV"
      - name: Verify release source namespace
        run: |
          python3 tests/keenetic/test-upstream-network.py
          python3 scripts/test-namespace.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.clean_build != true
        with:
          path: |
            build/telegram/openssl-${{ matrix.arch }}
            build/telegram/zlib-${{ matrix.arch }}
          key: d2s-crypto-v1-${{ runner.os }}-${{ matrix.arch }}-zig016-${{ hashFiles('scripts/build-openssl-tg.sh', 'scripts/build-target.sh', '.github/workflows/release.yml') }}
      - name: Build complete router package
        env:
          ARCHES: ${{ matrix.arch }}
          RELEASE_ID: d2s-v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
          JOBS: '4'
          D2S_CRYPTO_CACHE: ${{ inputs.clean_build && '0' || '1' }}
        run: sh scripts/build-router.sh
      - name: Execute binaries under QEMU
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in arm64) QEMU=qemu-aarch64;; arm) QEMU=qemu-arm;; mipsel) QEMU=qemu-mipsel;; esac
          "$QEMU" "builds/d2sd-linux-$ARCH" --help
          "$QEMU" "builds/d2sc-linux-$ARCH" --version
          "$QEMU" "builds/d2sfetch-linux-$ARCH" --version
          "$QEMU" "builds/d2spanel-linux-$ARCH" --version
          "$QEMU" "builds/d2stg-linux-$ARCH" --version
          "$QEMU" "builds/d2s-resolver-linux-$ARCH" --version
          "$QEMU" "builds/d2s-dns-watch-linux-$ARCH" --version
          "$QEMU" "build/telegram/openssl-link-smoke-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: builds/*-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
  publish:
    timeout-minutes: 10
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: builds
          merge-multiple: true
      - name: Package and sign immutable release
        env:
          RELEASE_ID: d2s-v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
          ARCHES: arm64 arm mipsel
          D2S_SIGNING_KEY: ${{ secrets.D2S_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$D2S_SIGNING_KEY"
          export NOTES="$(cat docs/release-notes.md)"
          sh scripts/package-release.sh builds release-out
          python3 scripts/test-d2s-package.py release-out
          umask 077
          key="$RUNNER_TEMP/d2s-release.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$D2S_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in release-out/latest.json -out release-out/latest.json.sig
          openssl pkeyutl -verify -pubin -inkey docs/d2s-release-public.pem -rawin -in release-out/latest.json -sigfile release-out/latest.json.sig
          (cd release-out && sha256sum d2s-*.tar.gz latest.json latest.json.sig > SHA256SUMS)
      - name: Refuse a superseded release source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$current" = "$SOURCE_SHA" ] || { echo 'main changed while building; keep artifacts and release the newer checked commit.' >&2; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: d2s-v${{ inputs.version }}
        run: |
          gh release create "$TAG" release-out/* --target "$GITHUB_SHA" --title "D2S ${{ inputs.version }}" --notes-file docs/release-notes.md --prerelease --latest=false
